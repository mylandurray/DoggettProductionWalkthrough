<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How It's Done · Doggett Group</title>
  <meta name="description" content="How it's done: follow one sheet through a production digital press, from feeder to finished stack." />
  <script>
    // set the theme before first paint (default light)
    try { document.documentElement.dataset.theme = localStorage.getItem('dg-theme') === 'dark' ? 'dark' : 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "animejs": "https://cdn.jsdelivr.net/npm/animejs@4.5.0/+esm"
      }
    }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels" aria-hidden="true"></div>

  <header class="brandbar">
    <a class="brand" href="#" aria-label="Doggett Group, back to top">
      <img src="assets/doggett-logo.png" alt="Doggett Group Creative Communications" width="570" height="264" />
    </a>
    <div class="bb-title">
      <span class="bb-kicker">How it&rsquo;s done</span>
      <span class="bb-name">The journey of a printed sheet</span>
    </div>
    <nav class="bb-tabs" aria-label="Processes">
      <a class="bb-tab" href="index.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8.5V3.5h10v5 M7 17H4.5V9.5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1V17H17 M7 14h10v6.5H7z"/><circle cx="16.5" cy="11.5" r=".9"/></svg>
        <span>Printing</span>
      </a>
      <a class="bb-tab" href="saddle-stitching.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C9.8 5 6.8 4.5 3.5 4.8v13.4c3.3-.3 6.3.2 8.5 1.7 2.2-1.5 5.2-2 8.5-1.7V4.8C17.2 4.5 14.2 5 12 6.5z M12 6.5v13.4 M10.6 9.5h2.8 M10.6 16h2.8"/></svg>
        <span>Saddle stitching</span>
      </a>
      <a class="bb-tab" href="perfect-binding.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 3.5h11v17h-11A2 2 0 0 1 5.5 18.5v-13a2 2 0 0 1 2-2z M9 3.5v17 M11.5 8h4.5 M11.5 10.5h3"/></svg>
        <span>Perfect binding</span>
      </a>
      <a class="bb-tab" href="foil-blocking.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5h6v4.5H9z M6 8h12v4.5H6z M3.5 20.5h17 M8.5 16.5h7"/><path d="M19 3v3 M17.5 4.5h3"/></svg>
        <span>Foil blocking</span>
      </a>
    </nav>
    <div class="bb-actions">
    <button class="play-toggle" type="button" aria-pressed="false" title="Play the tour automatically">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
      <span>Play</span>
    </button>
    <button class="speed-toggle" type="button" title="Playback speed">1&times;</button>
    <button class="solid-toggle" type="button" aria-pressed="false" title="Show internal parts as solids">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="cube-edge" d="M12 2.8 20 7.2v9.6L12 21.2 4 16.8V7.2z M4 7.2l8 4.4 8-4.4 M12 11.6v9.6"/><path class="cube-face" d="M12 11.6 20 7.2v9.6L12 21.2z"/></svg>
      <span>Solid parts</span>
    </button>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    </button>
    </div>
    <div class="progress" aria-hidden="true"><i></i></div>
  </header>

  <aside class="panel" aria-live="polite">
    <div class="ch-head"><span class="ch-num">00</span><span class="ch-kicker"></span>
      <span class="ch-nav">
        <button class="ch-prev" type="button" aria-label="Previous step" title="Previous step (&larr;)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg></button>
        <button class="ch-next" type="button" aria-label="Next step" title="Next step (&rarr;)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
      </span>
    </div>
    <h1 class="ch-title"></h1>
    <p class="ch-body"></p>
    <dl class="ch-specs"></dl>
  </aside>

  <div class="readout">
    <div class="ro-row"><span>SHEET</span><b id="ro-pos">0.0</b><i>mm</i></div>
    <div class="ro-row"><span>ZONE</span><b id="ro-zone">—</b></div>
    <div class="ro-row"><span>PASS</span><b id="ro-side">1 · SIDE A</b></div>
    <div class="ro-row"><span>TONER</span><b id="ro-toner">—</b></div>
  </div>

  <nav class="rail" aria-label="Chapters"></nav>

  <div class="minimap" aria-hidden="true">
    <div class="mm-cap">SIDE ELEVATION · PAPER PATH</div>
    <svg id="minimap"></svg>
  </div>

  <div class="scroll-hint"><span>Scroll</span><i></i></div>

  <div id="track" class="long"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
